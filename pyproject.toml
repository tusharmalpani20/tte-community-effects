[tool.pytest.ini_options]
pythonpath = ["effects"]
testpaths = ["tests"]
markers = ["effects: effect behavior", "manual: manual verification", "visual: visual verification"]
addopts = "-m 'not manual and not visual'"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
extraPaths = ["effects"]
